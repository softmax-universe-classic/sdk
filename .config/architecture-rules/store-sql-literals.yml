{
  "id": "store-sql-literals",
  "language": "TypeScript",
  "severity": "error",
  "message": "Keep SQL text in the owning store, including migration SQL.",
  "files": ["platform/src/**/*.ts"],
  "ignores":
    [
      "**/node_modules/**",
      "**/dist/**",
      ".contracts/**",
      ".local/**",
      "bazel-*/**",
      "platform/src/store/**",
    ],
  "rule":
    {
      "all":
        [
          { "any": [{ "kind": "string" }, { "kind": "template_string" }] },
          {
            "regex": "(?i)\\b(SELECT\\s+.+\\s+FROM|INSERT\\s+INTO|DELETE\\s+FROM|UPDATE\\s+.+\\s+SET|CREATE\\s+TABLE|ALTER\\s+TABLE|GRANT\\s+.+\\s+ON)\\b",
          },
        ],
    },
}
